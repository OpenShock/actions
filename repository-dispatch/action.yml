name: 'Repository Dispatch'
description: 'Send a repository_dispatch event to another repo'
inputs:
  repo:
    description: 'owner/repo to send the dispatch to'
    required: true
  event-type:
    description: 'Value for the event_type field'
    required: true
  client-payload:
    description: 'JSON object string used as the client_payload'
    required: false
    default: '{}'
  token:
    description: 'Token with permission to dispatch to the target repo'
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        jq -n --arg et '${{ inputs.event-type }}' --argjson cp '${{ inputs.client-payload }}' \
          '{event_type: $et, client_payload: $cp}' \
        | gh api "repos/${{ inputs.repo }}/dispatches" --input -
