name: 'Release Download'
description: 'Download (and optionally extract) an asset from the latest GitHub release of a repo'
inputs:
  repo:
    description: 'owner/repo to download the release asset from'
    required: true
  pattern:
    description: 'Glob pattern matching the asset filename'
    required: true
  extract:
    description: "Unzip any downloaded .zip assets in place"
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ inputs.repo }}
        PATTERN: ${{ inputs.pattern }}
        EXTRACT: ${{ inputs.extract }}
      run: |
        gh release download --repo "$REPO" --pattern "$PATTERN"
        if [ "$EXTRACT" = "true" ]; then
          for f in *.zip; do
            [ -f "$f" ] && unzip -o "$f"
          done
        fi
