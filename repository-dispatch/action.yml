name: 'Repository Dispatch'
description: 'Send a repository_dispatch event to another repo'
inputs:
  repo:
    description: 'owner/repo to send the dispatch to'
    required: true
  event-type:
    description: 'Value for the event_type field'
    required: true
  client-payload:
    description: 'JSON object string used as the client_payload'
    required: false
    default: '{}'
  token:
    description: 'Token with permission to dispatch to the target repo'
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ inputs.repo }}
        EVENT_TYPE: ${{ inputs.event-type }}
        CLIENT_PAYLOAD: ${{ inputs.client-payload }}
      run: |
        jq -n --arg et "$EVENT_TYPE" --argjson cp "$CLIENT_PAYLOAD" \
          '{event_type: $et, client_payload: $cp}' \
        | gh api "repos/$REPO/dispatches" --input -
