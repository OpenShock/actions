name: 'NSIS Build'
description: 'Install NSIS and compile an installer script (Windows runners only)'
inputs:
  script-file:
    description: 'Path to the .nsi script to compile'
    required: true
  plugin-dir:
    description: 'Additional NSIS plugin directory to register before compiling'
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Install NSIS
      shell: pwsh
      run: choco install nsis -y
    - name: Add NSIS to PATH
      shell: pwsh
      run: |
        # choco updates the machine PATH in the registry, but the next step
        # runs in a fresh process that won't see it unless we also add it to
        # GITHUB_PATH, which GitHub Actions applies to subsequent steps.
        $nsisDir = "${env:ProgramFiles(x86)}\NSIS"
        if (-not (Test-Path $nsisDir)) {
          $nsisDir = "$env:ProgramFiles\NSIS"
        }
        if (-not (Test-Path "$nsisDir\makensis.exe")) {
          throw "makensis.exe not found in expected NSIS install directory: $nsisDir"
        }
        Add-Content -Path $env:GITHUB_PATH -Value $nsisDir
    - name: Compile installer
      shell: pwsh
      env:
        SCRIPT_FILE: ${{ inputs.script-file }}
        PLUGIN_DIR: ${{ inputs.plugin-dir }}
      run: |
        if ($env:PLUGIN_DIR) {
          makensis /X"!addplugindir `"$env:PLUGIN_DIR`"" "$env:SCRIPT_FILE"
        } else {
          makensis "$env:SCRIPT_FILE"
        }
