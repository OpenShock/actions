name: 'Open PR From Diff'
description: 'Commit any working-tree changes to a branch, push it, and open (or reuse) a PR for it'
inputs:
  branch:
    description: 'Branch to commit and push the diff to'
    required: true
  commit-message:
    description: 'Commit message for the diff'
    required: true
  title:
    description: 'Title for the PR, if one needs to be created'
    required: true
  body:
    description: 'Body for the PR, if one needs to be created'
    required: false
    default: ''
outputs:
  pr-url:
    description: 'URL of the opened or existing PR, empty if there was nothing to commit'
    value: ${{ steps.pr.outputs.url }}
runs:
  using: composite
  steps:
    - id: pr
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        BRANCH: ${{ inputs.branch }}
        COMMIT_MESSAGE: ${{ inputs.commit-message }}
        TITLE: ${{ inputs.title }}
        BODY: ${{ inputs.body }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git checkout -B "$BRANCH"
        git add -A
        if git diff --cached --quiet; then
          echo "No changes to commit"
          echo "url=" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        git commit -m "$COMMIT_MESSAGE"
        if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
          git push -u origin "$BRANCH" --force-with-lease
        else
          git push -u origin "$BRANCH"
        fi
        if gh pr view "$BRANCH" >/dev/null 2>&1; then
          url=$(gh pr view "$BRANCH" --json url --jq .url)
        else
          url=$(gh pr create --title "$TITLE" --head "$BRANCH" --body "$BODY")
        fi
        echo "url=$url" >> "$GITHUB_OUTPUT"
